<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #F7FAF9;
        font-family: Arial, sans-serif;
      }
      #root { position: relative; width: 100%; height: 100%; background: #F7FAF9; }

      .scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

      .kicker { font-size: 26px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #0E7C66; margin-bottom: 10px; }
      .headline { font-size: 72px; font-weight: 800; color: #10241F; line-height: 1.1; letter-spacing: -0.01em; }
      .sub { font-size: 30px; color: #5C6B67; margin-top: 10px; }

      .axis { position: relative; height: 4px; background: #D8E2DF; margin-top: 44px; border-radius: 2px; }
      .tick { position: absolute; top: -8px; width: 4px; height: 20px; background: #0E7C66; border-radius: 2px; opacity: 0; }

      .bars { display: flex; flex-direction: column; gap: 46px; width: 1180px; }
      .bar-row { display: flex; align-items: center; gap: 28px; }
      .bar-icon { width: 76px; height: 76px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 38px; flex-shrink: 0; }
      .bar-label { width: 220px; font-size: 28px; font-weight: 700; color: #10241F; flex-shrink: 0; }
      .bar-track { position: relative; flex: 1; height: 26px; background: #E4ECE9; border-radius: 13px; overflow: visible; }
      .bar-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; border-radius: 13px; }
      .bar-tag { position: absolute; top: -40px; right: -10px; font-size: 20px; font-weight: 700; padding: 5px 12px; border-radius: 8px; color: #fff; opacity: 0; white-space: nowrap; }

      .grid4 { display: grid; grid-template-columns: repeat(2, 420px); grid-template-rows: repeat(2, 220px); gap: 32px; }
      .g-card {
        border-radius: 24px; background: #fff; box-shadow: 0 10px 30px rgba(16,36,31,0.08);
        display: flex; align-items: center; gap: 22px; padding: 0 36px;
        filter: blur(5px); opacity: 0.55; transform: scale(0.95);
      }
      .g-icon { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 42px; flex-shrink: 0; }
      .g-text { font-size: 26px; font-weight: 700; color: #10241F; line-height: 1.25; }

      #closeCanvas { position: absolute; inset: 0; }
      .close-tagline { position: absolute; left: 0; right: 0; text-align: center; top: 760px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">

      <!-- Escena 0: apertura, eje con ticks (0-3.5s) -->
      <div class="scene" id="s0">
        <div style="text-align:left; max-width:1200px;">
          <div class="kicker">Hoy aprendemos</div>
          <div class="headline">Tu perrito necesita<br/>4 cosas simples</div>
          <div class="sub">y las vemos una por una</div>
          <div class="axis" id="axis0" style="width:0;">
            <div class="tick" id="t0" style="left:0%;"></div>
            <div class="tick" id="t1" style="left:33%;"></div>
            <div class="tick" id="t2" style="left:66%;"></div>
            <div class="tick" id="t3" style="left:100%;"></div>
          </div>
        </div>
      </div>

      <!-- Escena 1: barras que crecen (3.5-9s) -->
      <div class="scene" id="s1" style="opacity:0;">
        <div class="bars">
          <div class="bar-row">
            <div class="bar-icon" style="background:#D9F0EA;">💧</div>
            <div class="bar-label">Agua</div>
            <div class="bar-track"><div class="bar-fill" id="bar1" style="background:#0E7C66;"><div class="bar-tag" id="tag1" style="background:#0E7C66;">Todos los días</div></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-icon" style="background:#DCE8FB;">🐾</div>
            <div class="bar-label">Paseo</div>
            <div class="bar-track"><div class="bar-fill" id="bar2" style="background:#2D6CDF;"><div class="bar-tag" id="tag2" style="background:#2D6CDF;">Todos los días</div></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-icon" style="background:#FDE3DF;">🩺</div>
            <div class="bar-label">Veterinario</div>
            <div class="bar-track"><div class="bar-fill" id="bar3" style="background:#FF6B5B;"><div class="bar-tag" id="tag3" style="background:#FF6B5B;">Cada 6 meses</div></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-icon" style="background:#FCEBCB;">💗</div>
            <div class="bar-label">Amor</div>
            <div class="bar-track"><div class="bar-fill" id="bar4" style="background:#E8A23D;"><div class="bar-tag" id="tag4" style="background:#E8A23D;">Siempre</div></div></div>
          </div>
        </div>
      </div>

      <!-- Escena 2: grid con enfoque secuencial (9-14s) -->
      <div class="scene" id="s2" style="opacity:0;">
        <div style="text-align:center;">
          <div class="grid4">
            <div class="g-card" id="g1"><div class="g-icon" style="background:#D9F0EA;">💧</div><div class="g-text">Agua<br/>fresca</div></div>
            <div class="g-card" id="g2"><div class="g-icon" style="background:#DCE8FB;">🐾</div><div class="g-text">Paseo<br/>diario</div></div>
            <div class="g-card" id="g3"><div class="g-icon" style="background:#FDE3DF;">🩺</div><div class="g-text">Chequeo<br/>veterinario</div></div>
            <div class="g-card" id="g4"><div class="g-icon" style="background:#FCEBCB;">💗</div><div class="g-text">Amor y<br/>compañía</div></div>
          </div>
          <div class="kicker" style="margin-top:36px;">Pequeños gestos, todos los días</div>
        </div>
      </div>

      <!-- Escena 3: cierre, partículas convergiendo en una marca (14-20s) -->
      <div class="scene" id="s3" style="opacity:0;">
        <canvas id="closeCanvas" width="1920" height="1080"></canvas>
        <div class="close-tagline" id="closeTag">
          <div class="headline" style="font-size:64px;">¡Cuidalo siempre!</div>
        </div>
      </div>
    </div>

    <script>
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(7);

      // --- sampleamos una silueta de huella sobre un canvas off-screen para usar como objetivo de las partículas ---
      function sampleShapeTargets(w, h, step) {
        const off = document.createElement('canvas');
        off.width = w; off.height = h;
        const octx = off.getContext('2d', { willReadFrequently: true });
        octx.clearRect(0, 0, w, h);
        octx.font = `${Math.floor(h * 0.82)}px Arial`;
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillText('🐾', w / 2, h / 2 + h * 0.04);
        const data = octx.getImageData(0, 0, w, h).data;
        const pts = [];
        for (let y = 0; y < h; y += step) {
          for (let x = 0; x < w; x += step) {
            if (data[(y * w + x) * 4 + 3] > 120) pts.push({ x, y });
          }
        }
        return pts;
      }
      const SHAPE_SIZE = 480;
      const shapeTargets = sampleShapeTargets(SHAPE_SIZE, SHAPE_SIZE, 6);
      const OFFSET_X = 960 - SHAPE_SIZE / 2;
      const OFFSET_Y = 560 - SHAPE_SIZE / 2;
      const PALETTE = ['#0E7C66', '#2D6CDF', '#FF6B5B', '#E8A23D'];
      const closeParticles = shapeTargets.map((t) => ({
        sx: rand() * 1920, sy: rand() * 1080,
        tx: t.x + OFFSET_X, ty: t.y + OFFSET_Y,
        r: 3.5 + rand() * 2.5,
        color: PALETTE[Math.floor(rand() * PALETTE.length)],
      }));
      const closeCanvas = document.getElementById('closeCanvas');
      const cctx = closeCanvas.getContext('2d', { willReadFrequently: true });
      function drawClose(progress, shimmerT) {
        cctx.clearRect(0, 0, 1920, 1080);
        closeParticles.forEach((p, i) => {
          const x = p.sx + (p.tx - p.sx) * progress;
          const jitter = shimmerT ? Math.sin(shimmerT * 3 + i) * 1.5 : 0;
          const y = p.sy + (p.ty - p.sy) * progress + jitter;
          cctx.beginPath();
          cctx.fillStyle = p.color;
          cctx.globalAlpha = 0.55 + progress * 0.4;
          cctx.arc(x, y, p.r, 0, Math.PI * 2);
          cctx.fill();
        });
        cctx.globalAlpha = 1;
      }
      drawClose(0, 0);

      const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.out' } });

      // --- Escena 0: apertura (0-3.5s) ---
      tl.fromTo('#s0 .kicker', { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.35 }, 0.1);
      tl.fromTo('#s0 .headline', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45 }, 0.25);
      tl.fromTo('#s0 .sub', { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.6);
      tl.to('#axis0', { width: 640, duration: 0.6, ease: 'power3.out' }, 0.9);
      tl.to(['#t0', '#t1', '#t2', '#t3'], { opacity: 1, duration: 0.25, stagger: 0.12 }, 1.3);
      tl.to('#s0', { opacity: 0, duration: 0.3 }, 3.2);

      // --- Escena 1: barras (3.5-9s) ---
      tl.set('#s1', { opacity: 1 }, 3.5);
      const bars = [
        { bar: '#bar1', tag: '#tag1', w: 85, start: 3.7 },
        { bar: '#bar2', tag: '#tag2', w: 85, start: 4.3 },
        { bar: '#bar3', tag: '#tag3', w: 42, start: 4.9 },
        { bar: '#bar4', tag: '#tag4', w: 100, start: 5.5 },
      ];
      bars.forEach(({ bar, tag, w, start }) => {
        tl.to(bar, { width: `${w}%`, duration: 0.7, ease: 'power3.out' }, start);
        tl.fromTo(tag, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3 }, start + 0.5);
      });
      tl.to('#s1', { opacity: 0, duration: 0.3 }, 8.65);

      // --- Escena 2: grid con enfoque secuencial (9-14s) ---
      tl.set('#s2', { opacity: 1 }, 9);
      tl.fromTo('.g-card', { opacity: 0, y: 20 }, { opacity: 0.55, y: 0, duration: 0.4, stagger: 0.08 }, 9.1);
      const focusCards = ['#g1', '#g2', '#g3', '#g4'];
      focusCards.forEach((sel, i) => {
        const t0 = 9.6 + i * 1.0;
        tl.to(sel, { filter: 'blur(0px)', opacity: 1, scale: 1.04, duration: 0.3, ease: 'power2.out' }, t0);
        tl.to(sel, { filter: 'blur(5px)', opacity: 0.55, scale: 0.95, duration: 0.3, ease: 'power2.inOut' }, t0 + 0.55);
      });
      tl.to(focusCards, { filter: 'blur(0px)', opacity: 1, scale: 1, duration: 0.35 }, 13.2);
      tl.fromTo('#s2 .kicker', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.3);
      tl.to('#s2', { opacity: 0, duration: 0.3 }, 13.65);

      // --- Escena 3: cierre con partículas (14-20s) ---
      tl.set('#s3', { opacity: 1 }, 14);
      const closeProxy = { p: 0 };
      tl.to(closeProxy, {
        p: 1, duration: 2.6, ease: 'power3.out',
        onUpdate: () => drawClose(closeProxy.p, 0),
      }, 14.2);
      tl.to({}, {
        duration: 2.0, ease: 'none',
        onUpdate: function () { drawClose(1, this.progress() * 2.0); },
      }, 16.9);
      tl.fromTo('#closeTag', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, 17.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
